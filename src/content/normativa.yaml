# Páginas por norma (/normativa/<id>/). Cada una reúne lo que la web tiene de esa norma:
# ideas clave, tablas de frecuencias, fechas del calendario, guías y análisis.
# - guideTags: entra cada guía con alguna de estas etiquetas (campo `tags` de la guía).
# - calendar: entra cada fecha de src/data/calendario.ts cuya fuente contenga alguno de estos textos.
# - frequencies: tablas de FrequencyTables (legionella, puntos, desinfeccion, grifo, piscinas).
# Datos comprobados en el BOE el 5 de noviembre de 2026 (los mismos que las guías).

- id: rd-487-2022
  order: 10
  norma: RD 487/2022
  topic: Legionella
  icon: droplet
  title: 'RD 487/2022 de Legionella: frecuencias, fechas y guías'
  description: 'Todo sobre el RD 487/2022 y el RD 614/2024 en una página: frecuencias de análisis, puntos de muestreo, fechas clave hasta 2030 y guías prácticas.'
  summary: 'El RD 487/2022, modificado por el RD 614/2024, obliga a tener un plan de prevención y control de Legionella en cada instalación de riesgo y a analizar Legionella por cultivo en laboratorio acreditado: cada mes en torres y cada trimestre en agua sanitaria.'
  updated: 2026-11-05
  boe: 'https://www.boe.es/buscar/act.php?id=BOE-A-2022-10297'
  keyPoints:
    - 'Cada instalación de riesgo necesita un plan de prevención y control (PPCL) o un plan sanitario frente a Legionella (PSL).'
    - 'Legionella cada mes en torres y condensadores evaporativos, y cada trimestre en agua sanitaria caliente y fría (anexo V, tabla 3).'
    - 'El cultivo debe hacerlo un laboratorio acreditado según UNE-EN ISO/IEC 17025 desde el 2 de enero de 2025 (art. 12.1).'
    - 'Hasta el 1 de enero de 2030 la muestra puede tomarla personal propio; después, solo una entidad acreditada para la toma (art. 11.5).'
    - 'En torres, a partir de 10.000 UFC/L se para la instalación; en agua sanitaria, desde 1.000 UFC/L se revisa el plan y se limpia y desinfecta (anexo VIII).'
  guideTags: ['Legionella']
  calendar: ['RD 487/2022', 'RD 614/2024']
  frequencies: ['legionella', 'puntos', 'desinfeccion']
  services:
    ['legionella', 'torres-y-calderas', 'legionella-qpcr', 'planes-legionella', 'toma-de-muestras']
  faq:
    - q: ¿Qué cambió el RD 614/2024?
      a: Modificó el RD 487/2022. Entre otros puntos, exige que la toma de muestras para cultivo de Legionella la haga una entidad acreditada, con un periodo transitorio hasta 2030, y obligó a actualizar los planes antes del 1 de julio de 2025.
    - q: ¿Puedo cambiar las frecuencias del anexo V?
      a: Con un plan sanitario frente a Legionella (PSL) basado en la evaluación del riesgo se pueden modificar los parámetros y las frecuencias. Con un PPCL se aplican los mínimos del anexo V.

- id: rd-3-2023
  order: 20
  norma: RD 3/2023
  topic: Agua de consumo
  icon: droplet
  title: 'RD 3/2023 de agua de consumo: control en grifo y fechas'
  description: 'El RD 3/2023 en una página: control en grifo, edificios prioritarios, Legionella en grifo, PFAS, notificación en SINAC, fechas clave y guías prácticas.'
  summary: 'El RD 3/2023 fija la calidad del agua de consumo hasta el grifo. Los edificios prioritarios, como hospitales, residencias y grandes hoteles, hacen además control en grifo con Legionella, de 2 a 6 veces al año o más según sus puntos de acceso al agua.'
  updated: 2026-11-05
  boe: 'https://www.boe.es/buscar/act.php?id=BOE-A-2023-628'
  keyPoints:
    - 'El control en grifo incluye E. coli, recuento de colonias a 22 °C, color, turbidez, pH, conductividad, cloro libre residual y plomo (anexo II).'
    - 'Los edificios prioritarios añaden Legionella, con un valor paramétrico de 100 UFC/L, y hacen de 2 a 6 análisis al año o más (tabla 13).'
    - 'Los resultados de Legionella de los edificios prioritarios se notifican en SINAC en 10 días laborables, o en 4 si hay incumplimiento.'
    - 'PFAS: 0,10 µg/L para la suma de 20 PFAS, de obligado cumplimiento desde el 2 de enero de 2026.'
    - 'Los laboratorios que analizan de 300 a 5.000 muestras al año deben estar acreditados antes del 2 de enero de 2028.'
  guideTags: ['agua de consumo']
  calendar: ['RD 3/2023']
  frequencies: ['grifo']
  services: ['agua-de-consumo', 'legionella', 'otros-analisis']
  faq:
    - q: ¿Quién es responsable del control en grifo de un edificio prioritario?
      a: El titular del edificio prioritario (art. 16 del RD 3/2023), de acuerdo con los anexos II y III. En la práctica lo suele organizar su empresa de mantenimiento.
    - q: ¿Qué es un edificio prioritario?
      a: Un gran edificio con muchos usuarios del anexo VIII, por ejemplo un hospital o una residencia de 200 camas, un hotel de 500 plazas o una instalación deportiva cubierta de 3.000 m².

- id: piscinas
  order: 30
  norma: RD 742/2013 y Decreto 99/2024
  topic: Piscinas
  icon: waves
  title: 'Normativa de piscinas en Madrid: controles y guías'
  description: 'El RD 742/2013 y el Decreto 99/2024 de Madrid en una página: control inicial, rutina diaria, control mensual en laboratorio, Legionella en spas y guías.'
  summary: 'Una piscina de uso público hace un control inicial en la quincena antes de abrir, un control de rutina diario in situ y un control periódico al menos una vez al mes en laboratorio, con E. coli y Pseudomonas aeruginosa.'
  updated: 2026-11-05
  boe: 'https://www.boe.es/buscar/act.php?id=BOE-A-2013-10580'
  keyPoints:
    - 'Control inicial en la quincena anterior a la apertura y después de tener el vaso cerrado más de dos semanas.'
    - 'Control de rutina cada día de uso, in situ, y control periódico al menos una vez al mes en laboratorio.'
    - 'En laboratorio: pH, turbidez, desinfectante, ácido isocianúrico si se usa, E. coli y Pseudomonas aeruginosa.'
    - 'Legionella (menos de 100 UFC/L) solo en vasos climatizados con aerosolización, como spas e hidromasajes.'
    - 'En la Comunidad de Madrid, el Decreto 99/2024 ya no exige Staphylococcus aureus.'
  guideTags: ['piscinas']
  calendar: ['RD 742/2013', 'Decreto 99/2024']
  frequencies: ['piscinas']
  services: ['piscinas', 'legionella']
  faq:
    - q: ¿Hay que analizar Legionella en una piscina?
      a: Solo en los vasos climatizados con aerosolización, como spas e hidromasajes, con un valor de menos de 100 UFC/L. En un vaso convencional, no.
    - q: ¿Se puede reducir el control mensual?
      a: El RD 742/2013 permite pedir que se reduzca tras dos años de autocontrol con resultados conformes.
